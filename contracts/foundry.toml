[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }

# See more config options https://book.getfoundry.sh/reference/config/
